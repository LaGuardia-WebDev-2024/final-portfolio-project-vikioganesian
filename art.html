function openModal(el) {
  const img = el.querySelector("img");

  document.getElementById("modal-img").src = img.src;

  document.getElementById("modal-title").innerText = img.dataset.title;
  document.getElementById("modal-size").innerText = img.dataset.size;
  document.getElementById("modal-materials").innerText = img.dataset.materials;
  document.getElementById("modal-year").innerText = img.dataset.year;

  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>
